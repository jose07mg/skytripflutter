name: skytrip
description: "SkyTrip - Hotel booking app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1
 
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.4
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  qr_flutter: ^4.1.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#003B95"
  adaptive_icon_foreground: "assets/images/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/ 
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Roboto  
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
